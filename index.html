<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Subway Prince</title>
<style>
  html,body{margin:0;height:100%;background:#0b0a16;overflow:hidden;touch-action:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;max-width:100vw;aspect-ratio:3/5;background:#000;display:block}
</style>
</head>
<body>
<canvas id="c" width="480" height="800"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 480, H = 800, CX = W / 2;
const HORIZON = 250, GROUND_Y = 660, NEAR = 260, LANE_W = 105, SPAWN_Z = 1900;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
// Everything that changes the outcome of a run uses this seeded generator, so a server can replay a run from its seed and inputs.
let simS = 1;
function simSeed(n) { simS = n >>> 0; }
function sr() { simS = (simS + 0x6D2B79F5) >>> 0; let t = simS; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
const srnd = (a, b) => a + sr() * (b - a);
const spick = a => a[Math.floor(sr() * a.length)];
const STEP = 1 / 60;
let acc = 0, ticks = 0, inputs = [], online = null, verified = null, starting = false, board = null, boardAt = 0, playerName = 'Prince' + Math.floor(1000 + Math.random() * 9000);
// Set API_URL to the address of your score server to turn on verified online play. Empty = offline play.
const API_URL = '';
const API = API_URL || (typeof location !== 'undefined' && location.port === '8787' ? location.origin : '');
let token = '';
try { playerName = localStorage.getItem('sp_name') || playerName; localStorage.setItem('sp_name', playerName); token = localStorage.getItem('sp_token') || ''; } catch (e) {}
function openAuth() {
  if (typeof document.createElement !== 'function' || document.getElementById('auth')) return;
  const d = document.createElement('div'); d.id = 'auth';
  d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:10;font:15px system-ui,sans-serif';
  d.innerHTML = '<div style="background:#1b1830;color:#fff;padding:20px;border-radius:14px;width:min(320px,86vw);display:flex;flex-direction:column;gap:10px"><b style="font-size:18px">' + (token ? 'Signed in as ' + playerName : 'Sign in to join the online board') + '</b>'
    + '<input id="au" placeholder="Username (3-16 letters, numbers, _)" maxlength="16" autocomplete="username" style="padding:10px;border-radius:8px;border:0">'
    + '<input id="ap" type="password" placeholder="Password (6+ characters)" autocomplete="current-password" style="padding:10px;border-radius:8px;border:0">'
    + '<div id="am" style="min-height:18px;color:#ffb3b3"></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button id="ain">Sign in</button><button id="acr">Create account</button><button id="aout">Sign out</button><button id="acl">Close</button></div></div>';
  document.body.appendChild(d);
  d.querySelectorAll('button').forEach(b => { b.style.cssText = 'padding:9px 12px;border:0;border-radius:8px;background:#2f7fd6;color:#fff;font-weight:700;cursor:pointer'; });
  const $ = id => document.getElementById(id), msg = t => { $('am').textContent = t; };
  const go = path => {
    msg('Please wait...');
    fetch(API + path, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ username: $('au').value, password: $('ap').value }) })
      .then(r => r.json()).then(j => {
        if (j.ok) { token = j.token; playerName = j.username; try { localStorage.setItem('sp_token', token); localStorage.setItem('sp_name', playerName); } catch (e) {} d.remove(); toast = { s: 'Signed in as ' + playerName, t: 2.5 }; boardAt = 0; }
        else msg(j.error || 'Something went wrong');
      }).catch(() => msg('Cannot reach the server'));
  };
  $('ain').onclick = () => go('/api/login'); $('acr').onclick = () => go('/api/register');
  $('aout').onclick = () => { token = ''; playerName = 'Player' + Math.floor(1000 + Math.random() * 9000); try { localStorage.removeItem('sp_token'); localStorage.setItem('sp_name', playerName); } catch (e) {} d.remove(); };
  $('acl').onclick = () => d.remove();
  $('au').focus();
}

// ---------- audio ----------
let actx = null;
let muted = false;
try { muted = localStorage.getItem('sp_mute') === '1'; } catch (e) {}
function toggleMute() { muted = !muted; try { localStorage.setItem('sp_mute', muted ? '1' : '0'); } catch (e) {} }
function beep(f, d, type = 'square', vol = 0.06, slide = 0) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    if (slide) o.frequency.linearRampToValueAtTime(f + slide, actx.currentTime + d);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + d);
  } catch (e) {}
}

function noise(d, vol = 0.15) {
  if (muted) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const n = Math.floor(actx.sampleRate * d), b = actx.createBuffer(1, n, actx.sampleRate), c = b.getChannelData(0);
    for (let i = 0; i < n; i++) c[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = actx.createBufferSource(), g = actx.createGain();
    src.buffer = b; g.gain.value = vol; src.connect(g); g.connect(actx.destination); src.start();
  } catch (e) {}
}
// looping chiptune that speeds up with the run
const SCALE = [0, 3, 5, 7, 10, 12, 15, 12, 10, 7, 5, 3];
const BASS = [110, 110, 87.31, 98];
let mStep = 0, musicOn = false;
function musicTick() {
  if (state === 'play' && !paused && !muted) {
    const root = BASS[Math.floor(mStep / 8) % 4], i = mStep % 8;
    if (i % 2 === 0) beep(root, 0.18, 'triangle', 0.05);
    if (i % 2 === 1 || i === 4) beep(root * 2 * Math.pow(2, SCALE[(mStep * 3 + Math.floor(mStep / 16)) % SCALE.length] / 12), 0.12, 'square', 0.018);
    mStep++;
  }
  setTimeout(musicTick, state === 'play' ? 210 - clamp((speed - 520) / 630, 0, 1) * 70 : 300);
}

// ---------- state ----------
let state = 'menu';            // menu | play | over
let paused = false;
let best = 0, bank = 0, owned = [0], sel = 0, missions = null, shopIdx = 0;
try {
  best = +localStorage.getItem('sp_best') || 0; bank = +localStorage.getItem('sp_bank') || 0;
  owned = JSON.parse(localStorage.getItem('sp_owned') || '[0]'); sel = +localStorage.getItem('sp_sel') || 0;
  missions = JSON.parse(localStorage.getItem('sp_missions') || 'null');
} catch (e) {}
function save() {
  try {
    localStorage.setItem('sp_best', best); localStorage.setItem('sp_bank', bank);
    localStorage.setItem('sp_owned', JSON.stringify(owned)); localStorage.setItem('sp_sel', sel);
    localStorage.setItem('sp_missions', JSON.stringify(missions));
  } catch (e) {}
}

const CHARS = [
  { name: 'Prince', skin: '#e0ac82', hair: '#3a2616', cost: 0, tunic: '#2a58c8', cape: '#c42f45', crown: '#ffd23f', perk: 'The royal original' },
  { name: 'Knight', skin: '#8d5a3b', hair: '#1a1208', cost: 150, tunic: '#8a93a6', cape: '#3b4256', crown: '#dfe6f5', perk: 'Starts every run with a shield', shield: true },
  { name: 'Sorcerer', skin: '#f1cfae', hair: '#cfd3dc', long: true, cost: 300, tunic: '#6a2fb8', cape: '#2c1050', crown: '#b98cff', perk: 'Power-ups last 50% longer', dur: 1.5 },
  { name: 'Dragon King', skin: '#c68642', hair: '#7a1a0a', cost: 600, tunic: '#2f9a5a', cape: '#8a1f1f', crown: '#ff8a3d', perk: 'Starting shield + longer power-ups', shield: true, dur: 1.5 },
  { name: 'Jester', skin: '#ffe0bd', hair: '#d4532b', cost: 250, tunic: '#d6325c', cape: '#2a9d8f', crown: '#ffd23f', perk: 'Each coin has a 25% chance to count double', bonus: 0.25 },
  { name: 'Astronaut', skin: '#6b4226', hair: '#111111', cost: 400, tunic: '#e8edf5', cape: '#4a90d9', crown: '#9fd8ff', perk: 'Starts every run with a 6s magnet', startMagnet: 6 },
  { name: 'Ninja', skin: '#f0c8a0', hair: '#111111', cost: 550, tunic: '#222831', cape: '#d62828', crown: '#e0e0e0', perk: 'Missions pay 25% more coins', mbonus: 1.25 }
];
const MISSION_POOL = [
  { k: 'meters', t: n => `Run ${n} m in one run`, vals: [400, 700, 1000], reward: [40, 70, 100] },
  { k: 'coins', t: n => `Collect ${n} coins in one run`, vals: [40, 70, 110], reward: [40, 70, 100] },
  { k: 'jumps', t: n => `Jump ${n} times in one run`, vals: [8, 15, 25], reward: [30, 50, 80] },
  { k: 'rolls', t: n => `Roll ${n} times in one run`, vals: [6, 12, 20], reward: [30, 50, 80] },
  { k: 'power', t: n => `Grab ${n} power-ups in one run`, vals: [2, 3, 5], reward: [40, 60, 100] }
];
function newMission(exclude) {
  const pool = MISSION_POOL.filter(m => !exclude.includes(m.k));
  const m = pick(pool), i = Math.floor(Math.random() * 3);
  return { k: m.k, target: m.vals[i], reward: m.reward[i], done: false };
}
function missionText(m) { return MISSION_POOL.find(p => p.k === m.k).t(m.target); }
function ensureMissions() {
  if (!Array.isArray(missions) || missions.length !== 3) missions = [];
  while (missions.length < 3) missions.push(newMission(missions.map(m => m.k)));
}
function refreshMissions() {
  ensureMissions();
  missions = missions.map((m, i) => m.done ? newMission(missions.filter((_, j) => j !== i).map(x => x.k)) : m);
}
ensureMissions(); save();

let pl, obs, coins, dist, speed, nextSpawn, coinCount, time, shake, popups, run, fx, guard, flash, justDone;
const POWER_NAMES = { magnet: 'MAGNET', shield: 'SHIELD', x2: '2x COINS', jet: 'JETPACK' };
const THEMES = [
  { name: 'Royal Dusk', sky: ['#1b1446', '#8a3d7a', '#ffb36b'], moon: '#fff3c4', line: '#2a1a4a', win: '#ffd98a', g0: '#4a3f5e', g1: '#2b2538', wall: ['#5a3b57', '#4d3350', '#664262'], light: '#ffe9a8' },
  { name: 'Neon District', sky: ['#06021a', '#2a0a5e', '#c4249b'], moon: '#88ffff', line: '#12082e', win: '#44ffff', g0: '#2a2a48', g1: '#15152c', wall: ['#241a4a', '#1d1540', '#2d1f5a'], light: '#00f0ff' },
  { name: 'Golden Desert', sky: ['#3a1c0a', '#c8562a', '#ffcf70'], moon: '#fff0b0', line: '#6a3418', win: '#ffe28a', g0: '#7a5a45', g1: '#4a3428', wall: ['#a8643a', '#96552f', '#b87345'], light: '#ffe9a8' },
  { name: 'Frost Kingdom', sky: ['#0b2a4a', '#5a8fc0', '#d6ecff'], moon: '#ffffff', line: '#2e4a6e', win: '#fff6c0', g0: '#5d7088', g1: '#3a4860', wall: ['#6f88a8', '#617a9a', '#7d96b6'], light: '#ffffff' }
];
let themeIdx = 0, themeFade = 0, jl = 0, jetT = 0, toast = { s: '', t: 0 }, daily = { last: '', streak: 0 };
try { daily = JSON.parse(localStorage.getItem('sp_daily') || 'null') || daily; } catch (e) {}
let scores = [], lastRank = -1;
try { scores = JSON.parse(localStorage.getItem('sp_scores') || '[]'); } catch (e) {}
// Reward goals. Prizes are NOT paid by the game: a finished goal gives a claim code that the game owner checks and pays out by hand.
const REWARD = { goalMeters: 1500, goalCoins: 800, prize: 'a prize set by the game owner' };
let life = 0, claim = '';
try { life = +localStorage.getItem('sp_life') || 0; claim = localStorage.getItem('sp_claim') || ''; } catch (e) {}
const goalsDone = () => best >= REWARD.goalMeters && life >= REWARD.goalCoins;
function makeClaim() {
  let h = 5381; const raw = best + '-' + life + '-' + Date.now();
  for (const c of raw) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0;
  return 'SP-' + h.toString(36).toUpperCase().padStart(6, '0') + '-' + Math.floor(Math.random() * 1679616).toString(36).toUpperCase().padStart(4, '0');
}
function claimReward() {
  if (!goalsDone() || claim) return;
  claim = makeClaim(); try { localStorage.setItem('sp_claim', claim); } catch (e) {}
  toast = { s: 'Goals complete! Your claim code is ready.', t: 3 }; beep(900, 0.4, 'triangle', 0.08, 500);
}
function copyClaim() {
  const msg = 'Subway Prince claim code ' + claim + ' | best run ' + best + ' m | ' + life + ' lifetime coins';
  try { navigator.clipboard.writeText(msg).then(() => { toast = { s: 'Copied. Send it to the game owner.', t: 2.5 }; }, () => { toast = { s: 'Copy failed. Write the code down.', t: 2.5 }; }); }
  catch (e) { toast = { s: 'Copy failed. Write the code down.', t: 2.5 }; }
}
const DAILY_REWARDS = [20, 30, 40, 60, 80, 100, 200];
const todayStr = (off = 0) => { const d = new Date(Date.now() + off * 864e5); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
function dailyReady() { return daily.last !== todayStr(); }
function dailyNext() { return daily.last === todayStr(-1) ? (daily.streak % 7) + 1 : 1; }
function claimDaily() {
  if (!dailyReady()) return;
  const day = dailyNext(), r = DAILY_REWARDS[day - 1];
  daily = { last: todayStr(), streak: day }; bank += r;
  try { localStorage.setItem('sp_daily', JSON.stringify(daily)); } catch (e) {}
  save(); toast = { s: 'Day ' + day + ' reward: +' + r + ' coins!', t: 3 }; beep(780, 0.3, 'triangle', 0.08, 500);
}
function reset() {
  pl = { lane: 0, x: 0, y: 0, vy: 0, roll: 0, onGround: true, inv: 0 };
  obs = []; coins = []; popups = [];
  dist = 0; speed = 520; nextSpawn = 300; coinCount = 0; time = 0; shake = 0;
  run = { jumps: 0, rolls: 0, power: 0 };
  fx = { magnet: CHARS[sel].startMagnet || 0, x2: 0, jet: 0, shield: !!CHARS[sel].shield };
  themeIdx = 0; themeFade = 0; jl = 0; jetT = 0;
  guard = 0; flash = 0; justDone = [];
}
reset();

// ---------- spawning ----------
function coinLine(lane, z, n = 6, hs) {
  for (let i = 0; i < n; i++) coins.push({ lane, z: z + i * 90, h: hs ? hs[i % hs.length] : 20 });
}
function spawn() {
  const z = SPAWN_Z, r = sr();
  const lanes = [-1, 0, 1], free = spick(lanes), others = lanes.filter(l => l !== free);
  let maxLen = 200;
  if (r < 0.34) {                                   // trains: change lane
    const n = sr() < 0.5 ? 1 : 2;
    const blocked = n === 2 ? others : [spick(others)];
    const col = spick(['#2f6fd6', '#d63f3f', '#e0a41f', '#2fa57a']);
    blocked.forEach(l => { const len = srnd(450, 850); maxLen = Math.max(maxLen, len); obs.push({ t: 'train', lane: l, z, len, h: 200, col }); });
    coinLine(free, z, 8);
  } else if (r < 0.58) {                            // lone barriers: jump or dodge
    others.forEach(l => { if (sr() < 0.8) obs.push({ t: 'low', lane: l, z, len: 30, h: 58 }); });
    coinLine(free, z, 6);
  } else if (r < 0.76) {                            // full-width hurdle: jump
    lanes.forEach(l => obs.push({ t: 'low', lane: l, z, len: 30, h: 58 }));
    coinLine(spick(lanes), z - 135, 4, [30, 80, 110, 80]);
  } else if (r < 0.92) {                            // overhead bars: roll
    lanes.forEach(l => obs.push({ t: 'over', lane: l, z, len: 30, h: 130 }));
    coinLine(spick(lanes), z - 135, 4);
  } else {                                          // coin snake
    for (let i = 0; i < 10; i++) coins.push({ lane: Math.round(Math.sin(i * 0.8)), z: z + i * 90, h: 20 });
  }
  if (r < 0.76 && sr() < 0.28) coins.push({ lane: free, z: z + 270, h: 40, p: spick(['magnet', 'shield', 'x2', 'jet']) });
  nextSpawn = maxLen + srnd(550, 800);
}

// ---------- input ----------
let buttons = [];
function shopAct(a) {
  if (a === 'left') shopIdx = (shopIdx + CHARS.length - 1) % CHARS.length;
  if (a === 'right') shopIdx = (shopIdx + 1) % CHARS.length;
  if (a === 'ok') {
    if (owned.includes(shopIdx)) sel = shopIdx;
    else if (bank >= CHARS[shopIdx].cost) { bank -= CHARS[shopIdx].cost; owned.push(shopIdx); sel = shopIdx; beep(700, 0.25, 'triangle', 0.07, 500); }
    else beep(120, 0.2, 'sawtooth', 0.05);
    save();
  }
  if (a === 'back') state = 'menu';
}
function act(a) {
  if (state === 'scores' || state === 'rewards') { if (a === 'start' || a === 'left') state = 'menu'; return; }
  if (state === 'shop') { shopAct(a === 'start' ? 'ok' : a === 'up' || a === 'down' ? '' : a); return; }
  if (state !== 'play') { if (a === 'start') startGame(); return; }
  if (paused) return;
  inputs.push([ticks, a]);
  if (a === 'left') { if (pl.lane > -1) { pl.lane--; beep(300, 0.06, 'triangle'); } }
  if (a === 'right') { if (pl.lane < 1) { pl.lane++; beep(300, 0.06, 'triangle'); } }
  if (a === 'up' && pl.onGround && fx.jet <= 0) { pl.vy = 850; pl.onGround = false; pl.roll = 0; run.jumps++; beep(380, 0.18, 'square', 0.05, 300); }
  if (a === 'down' && fx.jet <= 0) { if (!pl.onGround) pl.vy = -1400; pl.roll = 0.6; run.rolls++; beep(160, 0.15, 'sawtooth', 0.05, -60); }
}
function beginRun(seed, runId) {
  if (!musicOn) { musicOn = true; musicTick(); }
  refreshMissions(); save(); simSeed(seed); reset();
  ticks = 0; inputs = []; acc = 0; verified = null; online = runId ? { runId } : null;
  state = 'play'; paused = false; beep(520, 0.2, 'triangle', 0.07, 400);
}
function startGame() {
  if (starting) return;
  const offline = () => beginRun((Math.random() * 4294967296) >>> 0, null);
  if (!API) { offline(); return; }
  starting = true;
  fetch(API + '/api/run/start', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token, char: sel }) })
    .then(r => r.json()).then(j => { starting = false; if (j && j.runId) { if (token && !j.account) { token = ''; try { localStorage.removeItem('sp_token'); } catch (e) {} toast = { s: 'Session expired. Sign in again.', t: 3 }; } beginRun(j.seed, j.runId); } else offline(); })
    .catch(() => { starting = false; offline(); });
}
function loadBoard() {
  if (performance.now() - boardAt < 15000) return; boardAt = performance.now();
  fetch(API + '/api/leaderboard').then(r => r.json()).then(j => { board = j.top; }).catch(() => {});
}
function submitRun() {
  if (!online) return; const r0 = online; online = null; verified = { pending: true };
  fetch(API + '/api/run/finish', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ runId: r0.runId, ticks, inputs }) })
    .then(r => r.json()).then(j => { verified = j; boardAt = 0; }).catch(() => { verified = { ok: false }; });
}
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  const m = { arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right', arrowup: 'up', w: 'up', ' ': 'up', arrowdown: 'down', s: 'down' }[k];
  if (k === 'm') { toggleMute(); return; }
  if (k === 'p') { if (state === 'play') paused = !paused; return; }
  if (k === 'escape') { if (state === 'shop' || state === 'scores' || state === 'rewards') state = 'menu'; else if (state === 'play') paused = !paused; return; }
  if (state !== 'play' && (k === ' ' || k === 'enter')) { act('start'); e.preventDefault(); return; }
  if (state === 'menu' || state === 'over') { if (k === 'l') { state = 'scores'; return; } if (k === 'r') { state = 'rewards'; return; } }
  if (state !== 'play' && k === 'b') { shopIdx = sel; state = 'shop'; return; }
  if (m) { act(m); e.preventDefault(); }
});
let tx = 0, ty = 0, tt = 0, touching = false;
cv.addEventListener('pointerdown', e => {
  tx = e.clientX; ty = e.clientY; tt = performance.now(); touching = true;
  if (state !== 'play') {
    const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
    const b = buttons.find(b => x >= b.x - b.w / 2 && x <= b.x + b.w / 2 && y >= b.y - b.h / 2 && y <= b.y + b.h / 2);
    if (b) b.fn();
    touching = false;
  } else if (paused) paused = false;
});
cv.addEventListener('pointermove', e => {
  if (!touching) return;
  const dx = e.clientX - tx, dy = e.clientY - ty;
  if (Math.hypot(dx, dy) > 30) {
    act(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    touching = false;
  }
});
addEventListener('pointerup', () => touching = false);

// ---------- update ----------
function runStat(k) { return k === 'meters' ? Math.floor(dist / 100) : k === 'coins' ? coinCount : run[k]; }
function checkMissions(final) {
  missions.forEach(m => {
    if (!m.done && runStat(m.k) >= m.target) {
      const r = Math.round(m.reward * (CHARS[sel].mbonus || 1));
      m.done = true; bank += r; justDone.push(m);
      popups.push({ x: CX, y: 150, t: 2, s: 'Mission complete! +' + r, big: true });
      beep(660, 0.3, 'triangle', 0.07, 600);
    }
  });
}
function gameOver() {
  state = 'over'; shake = 0.5; beep(120, 0.5, 'sawtooth', 0.1, -80); noise(0.45);
  const score = Math.floor(dist / 100);
  if (score > best) best = score;
  bank += coinCount; life += coinCount;
  try { localStorage.setItem('sp_life', life); } catch (e) {}
  const entry = { m: score, c: coinCount, ch: CHARS[sel].name };
  scores.push(entry); scores.sort((a, b) => b.m - a.m); scores = scores.slice(0, 5);
  lastRank = scores.indexOf(entry);
  try { localStorage.setItem('sp_scores', JSON.stringify(scores)); } catch (e) {}

// one drawing routine for every person in the game; feet at (0,0), about 152 units tall
function drawHuman(L) {
  const back = L.view !== 'front', ph = L.ph, run = ph != null, air = !!L.air, hipY = -74;
  const bob = run && !air ? -Math.abs(Math.sin(ph)) * 3 : (run ? 0 : Math.sin(L.t * 2) * 0.8);
  ctx.save(); ctx.translate(0, bob);
  if (L.cape && back) {
    const w = Math.sin(run ? ph * 0.7 : 0) * 5, a2 = air ? -8 : 0;
    const g = ctx.createLinearGradient(0, -124, 0, -34); g.addColorStop(0, shade(L.capeCol, 0.95)); g.addColorStop(1, shade(L.capeCol, 0.6));
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-17, -122); ctx.lineTo(17, -122);
    ctx.quadraticCurveTo(26 + w, -80, 24 + w * 1.5, -34 + a2); ctx.lineTo(-24 - w * 1.5, -34 + a2); ctx.quadraticCurveTo(-26 - w, -80, -17, -122); ctx.fill();
    ctx.strokeStyle = shade(L.capeCol, 0.5); ctx.lineWidth = 1.2;
    for (const c0 of [-9, 0, 9]) { ctx.beginPath(); ctx.moveTo(c0, -118); ctx.quadraticCurveTo(c0 * 1.5 + w, -80, c0 * 1.9 + w * 1.3, -36 + a2); ctx.stroke(); }
  }
  // legs
  for (const side of [-1, 1]) {
    const s = run ? Math.sin(ph + (side > 0 ? 0 : Math.PI)) : 0;
    const lift = air ? (side > 0 ? 0.8 : 0.3) : Math.max(0, s), bend = lift * 1.25;
    const hx = side * 7, ky = hipY + 36 - lift * 8, ex = hx + side * 2, ey = ky + 36 * Math.cos(bend);
    limb([[hx, hipY], [hx + side * 0.5, ky], [ex, ey]], 12, L.pants);
    ell(ex + side * 0.5, ey + 2, 7.5, 4.2, L.shoes);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(ex - 7, ey + 4.5, 14, 1.6);
    ell(ex - 2, ey + 0.5, 3.5, 1.4, 'rgba(255,255,255,0.18)');
  }
  // torso
  const tg = ctx.createLinearGradient(-19, 0, 19, 0);
  tg.addColorStop(0, shade(L.top, 0.7)); tg.addColorStop(0.5, shade(L.top, 1.1)); tg.addColorStop(1, shade(L.top, 0.72));
  ctx.fillStyle = tg; ctx.beginPath(); ctx.moveTo(-20, -118); ctx.quadraticCurveTo(-20, -126, -12, -126); ctx.lineTo(12, -126); ctx.quadraticCurveTo(20, -126, 20, -118);
  ctx.lineTo(14, -78); ctx.quadraticCurveTo(0, -72, -14, -78); ctx.closePath(); ctx.fill();
  ctx.fillStyle = L.trim; ctx.fillRect(-14.2, -82, 28.4, 4.5);
  ctx.fillStyle = '#2a1d14'; ctx.fillRect(-14, -86, 28, 3);
  ctx.strokeStyle = shade(L.top, 0.55); ctx.lineWidth = 1;
  if (back) {
    ctx.beginPath(); ctx.moveTo(0, -122); ctx.lineTo(0, -86); ctx.stroke();
    ell(-8, -108, 6, 9, 'rgba(255,255,255,0.07)'); ell(8, -108, 6, 9, 'rgba(255,255,255,0.07)');
  } else {
    ctx.beginPath(); ctx.moveTo(0, -122); ctx.lineTo(0, -86); ctx.stroke();
    ctx.fillStyle = L.trim; for (let k = 0; k < 4; k++) ctx.fillRect(-1, -114 + k * 7, 2, 2.4);
    ell(0, -84.5, 3, 2, '#e8c050');
  }
  ctx.beginPath(); ctx.moveTo(-10, -100); ctx.quadraticCurveTo(-4, -96, -12, -90); ctx.moveTo(10, -102); ctx.quadraticCurveTo(5, -97, 11, -91); ctx.strokeStyle = 'rgba(0,0,0,0.18)'; ctx.stroke();
  ell(0, -125, 9, 3, L.trim);
  if (L.acc === 'astro' && back) { ctx.fillStyle = '#e4e9f0'; ctx.fillRect(-11, -118, 22, 30); ctx.fillStyle = '#4a90d9'; ctx.fillRect(-11, -104, 22, 4); }
  // arms
  for (const side of [-1, 1]) {
    const s = run ? Math.sin(ph + (side > 0 ? Math.PI : 0)) : 0;
    const sh = [side * 19, -120]; let el, ha;
    if (air) { el = [side * 28, -108]; ha = [side * 33, -138]; }
    else if (run) { el = [side * 24, -96 - s * 4]; ha = [side * 26, el[1] - 12 - s * 10]; }
    else { el = [side * 23, -98]; ha = [side * 24, -76]; }
    limb([sh, el, ha], 9, L.top);
    ell(ha[0], ha[1], 4.6, 4.6, shade(L.trim, 0.9));
    ell(ha[0], ha[1] - 3, 4.2, 4.2, L.skin);
    if (L.armor) ell(side * 19, -121, 7.5, 5, '#cfd6e6');
  }
  ctx.fillStyle = shade(L.skin, 0.78); ctx.fillRect(-4.2, -131, 8.4, 8);
  const hy = -140;
  ell(-10.2, hy + 1, 2.2, 3.2, shade(L.skin, 0.9)); ell(10.2, hy + 1, 2.2, 3.2, shade(L.skin, 0.9));
  if (back) headBack(L, hy); else headFront(L, hy);
  accessory(L, hy, back);
  ctx.restore();
}

function drawGuard() {

function drawPlayer(x = CX + pl.x * LANE_W, fy = GROUND_Y - pl.y, sc = 1, ch = CHARS[sel], air = !pl.onGround, rolling = pl.roll > 0, preview = false) {

  const v = Object.assign({}, L, { view: preview ? 'front' : 'back', ph: preview ? null : time * 14, air, t: time });
  if (rolling) {

}

function drawCommuter(s, side, z) {
  const p = P(z), x = LX(side * 1.42, p), y = Y(p);
  const r = k => rng(s * 31 + k + (side > 0 ? 7 : 0));
  const pk = (arr, k) => arr[Math.floor(r(k) * arr.length)];
  const look = { skin: pk(NPC_SKINS, 1), hair: pk(NPC_HAIR, 2), hs: pk(['short', 'short', 'long', 'bun', 'curly'], 3), top: pk(NPC_TOPS, 4), trim: pk(NPC_TOPS, 5),
    pants: pk(NPC_PANTS, 6), shoes: '#1d1a1a', acc: 'none', cape: false, view: 'front', ph: null, air: false, t: time + s };
  ctx.globalAlpha = z > 1400 ? clamp((SPAWN_Z - z) / 500, 0, 1) : 1;
  ell(x, y + 2, 20 * p, 5 * p, 'rgba(0,0,0,0.35)');
  ctx.save(); ctx.translate(x, y); ctx.scale(p * 0.92, p * 0.92); drawHuman(look); ctx.restore();
  ctx.globalAlpha = 1;
}
function addCommuters(items) {
  const seg = 300, base = Math.floor(dist / seg);
  for (let i = 0; i <= 15; i++) {
    const s = base + i;
    for (const side of [-1, 1]) {
      if (rng(s * 2 + (side > 0 ? 1 : 0)) < 0.45) {
        const z = s * seg + rng(s * 5 + side) * 250 - dist;
        if (z > -150 && z < 1900) items.push({ z, f: () => drawCommuter(s, side, z) });
      }
    }
  }
}

    text(has ? (sel === shopIdx ? 'In use' : 'Owned') : c.cost + ' coins', CX, 552, 18, has ? '#8dff7a' : '#ffd23f');
    btn(CX, 610, 240, 56, has ? (sel === shopIdx ? 'SELECTED' : 'SELECT') : 'BUY', has ? '#2fa57a' : bank >= c.cost ? '#d68a1f' : '#666', () => shopAct('ok'));
    btn(CX, 680, 160, 46, 'BACK', '#555', () => { state = 'menu'; }, 18);
  }
}

function render() {
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-1, 1) * shake * 20, rnd(-1, 1) * shake * 20);
  buttons = [];
  drawBackground(); drawTrack(); drawFog();
  const items = [];
  addCommuters(items);
  obs.forEach(o => items.push({ z: o.z, f: () => drawObstacle(o) }));
  coins.forEach(c => items.push({ z: c.z, f: () => drawCoin(c) }));
  items.push({ z: 0, f: () => drawPlayer() });
  if (guard > 0) items.push({ z: -60, f: drawGuard });
  items.sort((a, b) => b.z - a.z);
  items.forEach(i => i.f());
  drawVignette();
  if (state === 'play') drawHUD(); else { drawMenu(); popups = []; }
  ctx.restore();
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state === 'play' && !paused) { acc = Math.min(acc + dt, 0.1); while (acc >= STEP && state === 'play') { update(STEP); ticks++; acc -= STEP; } }
  else { acc = 0; if (state === 'menu') { dist += 300 * dt; time += dt; } }
  if (shake > 0) shake -= dt;
  if (toast.t > 0) toast.t -= dt;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
